<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Fire TV WebView Probe</title>
  <!-- A test probe touching a TV whose screen shows three readings: two pass, one fail.
       Colours are the probe's own UI tokens (probe.css). -->
  <rect width="512" height="512" fill="#11161c"/>
  <!-- TV -->
  <rect x="40" y="84" width="330" height="212" rx="26" fill="#1f2933" stroke="#f2f4f6" stroke-width="16"/>
  <rect x="165" y="312" width="80" height="18" rx="9" fill="#f2f4f6"/>
  <rect x="129" y="340" width="152" height="18" rx="9" fill="#f2f4f6"/>
  <!-- readings -->
  <circle cx="104" cy="150" r="16" fill="#4cc38a"/><rect x="134" y="138" width="160" height="24" rx="12" fill="#4cc38a"/>
  <circle cx="104" cy="196" r="16" fill="#4cc38a"/><rect x="134" y="184" width="116" height="24" rx="12" fill="#4cc38a"/>
  <circle cx="104" cy="242" r="16" fill="#ef6461"/><rect x="134" y="230" width="72" height="24" rx="12" fill="#ef6461"/>
  <!-- test probe: drawn pointing up with the tip at (0,0), then turned so the tip rests on the
       screen near its lower-right corner and the lead runs off the bottom-right edge -->
  <g transform="translate(336 262) rotate(-40)">
    <path d="M0 214 C 0 262, 22 290, 64 318" fill="none" stroke="#9aa5b1" stroke-width="14" stroke-linecap="round"/>
    <path d="M-5 46 L-2 4 Q0 -2 2 4 L5 46 Z" fill="#d6dde4"/>
    <rect x="-36" y="44" width="72" height="22" rx="11" fill="#d99a00"/>
    <rect x="-26" y="64" width="52" height="124" rx="18" fill="#f5b700"/>
    <rect x="-26" y="98" width="52" height="9" fill="#11161c" opacity=".3"/>
    <rect x="-26" y="118" width="52" height="9" fill="#11161c" opacity=".3"/>
    <rect x="-26" y="138" width="52" height="9" fill="#11161c" opacity=".3"/>
    <rect x="-15" y="184" width="30" height="32" rx="8" fill="#d99a00"/>
  </g>
</svg>
